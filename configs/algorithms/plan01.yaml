# Default text RAG-HPO space for all experiments unless an ablation says otherwise.
# All-on product: 103,680. With rewriter/reranker/pruner off: 199,680.
# Generator and judge URLs are frozen, not searchable.
# Canonical copy: configs/algorithms/fullspace.yaml
# Override endpoints with QWEN_* and CITYU_LLM_* in .env.

rag_search_space:
  rewriter:
    model_url: ["http://127.0.0.1:8000/v1"]
    prompt_template_id: ["1", "2", "3"]

  chunking:
    chunk_size: [256, 512, 1024, 2048]
    chunk_overlap: [0, 64, 128, 192]

  retrieve:
    model_url: ["models/all-MiniLM-L6-v2", "models/all-MiniLM-L12-v2"]
    topk: [1, 3, 5, 10, 20, 50]
    bm25_weight: [0.0, 0.25, 0.5, 0.75, 1.0]

  reranker:
    model_url: ["models/ms-marco-MiniLM-L6-v2", "models/ms-marco-TinyBERT-L2-v2"]
    topk: [1, 3, 5, 10, 20, 50]

  pruner:
    model_url: ["http://127.0.0.1:8000/v1"]
    prompt_template_id: ["1", "2", "3"]

  generator:
    model_url: ["http://127.0.0.1:8000/v1"]

eval_metrics:
  enabled: "F1,ROUGE-L,BLEU,METEOR,LLMAAJ"
  llmaaj:
    model_url: "http://127.0.0.1:8888/v1"
    model_name: "your-judge-model"
